AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SecureHealth - AWS-based secure patient records portal (MCSC-6002 group project).
  Phase 1 skeleton: Cognito user pool with MFA + role groups, KMS CMK,
  DynamoDB tables (patients, audit), REST API with Cognito authorizer,
  and an authenticated /health endpoint proving the security gate end-to-end.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256
    Architectures: [x86_64]
    Environment:
      Variables:
        PATIENTS_TABLE: !Ref PatientsTable
        AUDIT_TABLE: !Ref AuditTable
        KMS_KEY_ID: !Ref DataKey

Resources:

  # ---------------- Cognito: authentication + MFA + RBAC groups ----------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: securehealth-users
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true   # staff accounts are provisioned, not self-signup
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED   # Cognito threat protection: blocks credential stuffing
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: securehealth-web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH      # convenient for CLI testing; SRP used by frontend
        - ALLOW_REFRESH_TOKEN_AUTH
      IdTokenValidity: 1                 # short-lived tokens (hours)
      AccessTokenValidity: 1
      RefreshTokenValidity: 8
      TokenValidityUnits:
        IdToken: hours
        AccessToken: hours
        RefreshToken: hours

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: Admin, UserPoolId: !Ref UserPool, Precedence: 1 }
  DoctorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: Doctor, UserPoolId: !Ref UserPool, Precedence: 2 }
  ReceptionistGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: Receptionist, UserPoolId: !Ref UserPool, Precedence: 3 }

  # ---------------- KMS: customer-managed key for PHI ----------------
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: SecureHealth CMK - envelope encryption for clinical fields and table encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: RootAccountAdmin       # account admin retains key administration
            Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'
          # Usage grants for Lambda roles are added per-function below via policies;
          # no other principal can use this key.

  # ---------------- DynamoDB: patients + append-only audit ----------------
  PatientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: securehealth-patients
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: patient_id, AttributeType: S }
      KeySchema:
        - { AttributeName: patient_id, KeyType: HASH }
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true   # protected backups (ransomware resilience)

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: securehealth-audit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: day, AttributeType: S }        # partition: YYYY-MM-DD
        - { AttributeName: event_time, AttributeType: S } # sort: ISO timestamp + uuid suffix
      KeySchema:
        - { AttributeName: day, KeyType: HASH }
        - { AttributeName: event_time, KeyType: RANGE }
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---------------- API Gateway account-level logging role ----------------
  # One-time-per-account/region setting: API Gateway can only write access logs
  # to CloudWatch if this role ARN is registered at the account level.
  ApiGatewayLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: apigateway.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayLoggingRole.Arn

  # ---------------- REST API with Cognito authorizer ----------------
  Api:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      Name: securehealth-api
      StageName: v1
      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 20       # DoS mitigation (STRIDE: Denial of Service)
          ThrottlingBurstLimit: 40
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","user":"$context.authorizer.claims.cognito:username","method":"$context.httpMethod","path":"$context.path","status":"$context.status"}'

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /securehealth/api-access
      RetentionInDays: 30

  # ---------------- Lambda: authenticated health check ----------------
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: securehealth-health
      Handler: health.handler
      CodeUri: src/handlers/
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref AuditTable }
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !GetAtt DataKey.Arn
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /health
            Method: get

  # ---------------- Lambda: patient records CRUD ----------------
  PatientsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: securehealth-patients
      Handler: patients.handler
      CodeUri: src/handlers/
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PatientsTable }
        - DynamoDBWritePolicy: { TableName: !Ref AuditTable }
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !GetAtt DataKey.Arn
      Events:
        Create:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /patients, Method: post }
        Search:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /patients, Method: get }
        Read:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/patients/{id}", Method: get }
        Update:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: "/patients/{id}", Method: put }

  # ---------------- Lambda: audit log reader (Admin only) ----------------
  AuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: securehealth-audit
      Handler: audit.handler
      CodeUri: src/handlers/
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref AuditTable }
        - DynamoDBWritePolicy: { TableName: !Ref AuditTable }
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !GetAtt DataKey.Arn
      Events:
        ReadAudit:
          Type: Api
          Properties: { RestApiId: !Ref Api, Path: /audit, Method: get }

  # ============================================================================
  # Monitoring & alerting
  # ============================================================================

  # --- Notification channel for security alarms -------------------------------
  SecurityAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: securehealth-security-alerts
      DisplayName: SecureHealth Security Alerts

  # --- Metric filters: turn structured log lines into custom metrics -----------
  # Each SECURITY_EVENT line printed by common.emit_security_event() is parsed
  # here. This keeps the Lambda hot path free of PutMetricData calls.

  DeniedAccessMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub '/aws/lambda/${PatientsFunction}'
      FilterPattern: '{ $.event = "SECURITY_EVENT" && $.denied IS TRUE }'
      MetricTransformations:
        - MetricNamespace: SecureHealth/Security
          MetricName: DeniedAccessAttempts
          MetricValue: '1'
          DefaultValue: 0

  TamperDetectedMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub '/aws/lambda/${PatientsFunction}'
      FilterPattern: '{ $.action = "TAMPER_DETECTED" }'
      MetricTransformations:
        - MetricNamespace: SecureHealth/Security
          MetricName: TamperDetections
          MetricValue: '1'
          DefaultValue: 0

  ValidationRejectMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub '/aws/lambda/${PatientsFunction}'
      FilterPattern: '{ $.action = "VALIDATION_REJECT" }'
      MetricTransformations:
        - MetricNamespace: SecureHealth/Security
          MetricName: ValidationRejections
          MetricValue: '1'
          DefaultValue: 0

  PhiAccessMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub '/aws/lambda/${PatientsFunction}'
      FilterPattern: '{ $.event = "SECURITY_EVENT" && ($.action = "PATIENT_READ" || $.action = "PATIENT_SEARCH") && $.outcome = "OK" }'
      MetricTransformations:
        - MetricNamespace: SecureHealth/Security
          MetricName: PhiAccessEvents
          MetricValue: '1'
          DefaultValue: 0

  AuditReadDeniedMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AuditFunction}'
      FilterPattern: '{ $.action = "AUDIT_READ" && $.denied IS TRUE }'
      MetricTransformations:
        - MetricNamespace: SecureHealth/Security
          MetricName: AuditReadDenied
          MetricValue: '1'
          DefaultValue: 0

  # --- Alarms -----------------------------------------------------------------

  # Any tamper detection is a single-event alarm: one is already too many.
  TamperAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SecureHealth-RecordTamperDetected
      AlarmDescription: A patient record failed SHA-256 integrity verification.
      Namespace: SecureHealth/Security
      MetricName: TamperDetections
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SecurityAlertTopic]

  # Repeated denials suggest probing or a misconfigured client.
  DeniedAccessAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SecureHealth-RepeatedAccessDenials
      AlarmDescription: Five or more denied access attempts within five minutes.
      Namespace: SecureHealth/Security
      MetricName: DeniedAccessAttempts
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SecurityAlertTopic]

  # A burst of rejections looks like automated payload probing.
  ValidationRejectAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SecureHealth-InputAttackProbing
      AlarmDescription: Ten or more input validation rejections within five minutes.
      Namespace: SecureHealth/Security
      MetricName: ValidationRejections
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SecurityAlertTopic]

  # Availability: sustained 5xx means the API is failing, not just being probed.
  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SecureHealth-ApiServerErrors
      AlarmDescription: API Gateway returned five or more 5xx responses in five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - { Name: ApiName, Value: securehealth-api }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SecurityAlertTopic]

  # Throttling indicates the DoS control is engaging.
  ApiThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SecureHealth-ApiThrottling
      AlarmDescription: API Gateway throttled twenty or more requests in five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - { Name: ApiName, Value: securehealth-api }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SecurityAlertTopic]

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SecureHealth-PatientsFunctionErrors
      AlarmDescription: The patients function raised three or more errors in five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: securehealth-patients }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref SecurityAlertTopic]

  # --- Dashboard --------------------------------------------------------------
  SecurityDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: SecureHealth-Security
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "markdown": "# SecureHealth - Security Operations\n**Region:** ${AWS::Region} | PHI access, denied attempts, integrity alerts and API health. Alarms publish to the `securehealth-security-alerts` SNS topic."
              }
            },
            {
              "type": "metric", "x": 0, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "Integrity alerts (tamper detected)",
                "metrics": [["SecureHealth/Security", "TamperDetections", {"color": "#d13212"}]],
                "view": "timeSeries", "stat": "Sum", "period": 300,
                "region": "${AWS::Region}",
                "annotations": {"horizontal": [{"label": "Alarm", "value": 1, "color": "#d13212"}]}
              }
            },
            {
              "type": "metric", "x": 8, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "Denied access attempts (RBAC)",
                "metrics": [
                  ["SecureHealth/Security", "DeniedAccessAttempts", {"color": "#ff7f0e"}],
                  ["SecureHealth/Security", "AuditReadDenied", {"color": "#9467bd"}]
                ],
                "view": "timeSeries", "stat": "Sum", "period": 300,
                "region": "${AWS::Region}",
                "annotations": {"horizontal": [{"label": "Alarm", "value": 5, "color": "#ff7f0e"}]}
              }
            },
            {
              "type": "metric", "x": 16, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "Input validation rejections (attack probing)",
                "metrics": [["SecureHealth/Security", "ValidationRejections", {"color": "#e377c2"}]],
                "view": "timeSeries", "stat": "Sum", "period": 300,
                "region": "${AWS::Region}",
                "annotations": {"horizontal": [{"label": "Alarm", "value": 10, "color": "#e377c2"}]}
              }
            },
            {
              "type": "metric", "x": 0, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "PHI access volume (successful reads and searches)",
                "metrics": [["SecureHealth/Security", "PhiAccessEvents", {"color": "#1f77b4"}]],
                "view": "timeSeries", "stat": "Sum", "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric", "x": 12, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway - requests and errors",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "securehealth-api", {"label": "Requests"}],
                  [".", "4XXError", ".", ".", {"label": "4xx (auth/validation)", "color": "#ff7f0e"}],
                  [".", "5XXError", ".", ".", {"label": "5xx (server)", "color": "#d13212"}]
                ],
                "view": "timeSeries", "stat": "Sum", "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric", "x": 0, "y": 14, "width": 8, "height": 6,
              "properties": {
                "title": "Lambda invocations and errors",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "securehealth-patients"],
                  [".", "Errors", ".", ".", {"color": "#d13212"}]
                ],
                "view": "timeSeries", "stat": "Sum", "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric", "x": 8, "y": 14, "width": 8, "height": 6,
              "properties": {
                "title": "API latency (p50 / p99)",
                "metrics": [
                  ["AWS/ApiGateway", "Latency", "ApiName", "securehealth-api", {"stat": "p50", "label": "p50"}],
                  ["...", {"stat": "p99", "label": "p99"}]
                ],
                "view": "timeSeries", "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric", "x": 16, "y": 14, "width": 8, "height": 6,
              "properties": {
                "title": "DynamoDB capacity (patients / audit)",
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "securehealth-patients"],
                  [".", "ConsumedWriteCapacityUnits", ".", "."],
                  [".", "ConsumedWriteCapacityUnits", ".", "securehealth-audit", {"label": "Audit writes"}]
                ],
                "view": "timeSeries", "stat": "Sum", "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "log", "x": 0, "y": 20, "width": 24, "height": 8,
              "properties": {
                "title": "Recent security events (denials, rejections, tamper alerts)",
                "query": "SOURCE '/aws/lambda/securehealth-patients' | fields @timestamp, action, outcome, role, user, patient_id | filter event = 'SECURITY_EVENT' and (denied = 1 or blocked = 1 or alert = 1) | sort @timestamp desc | limit 50",
                "region": "${AWS::Region}",
                "view": "table"
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Description: Base URL for the SecureHealth API
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/v1'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  KmsKeyId:
    Value: !Ref DataKey
  DashboardUrl:
    Description: CloudWatch security dashboard
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=SecureHealth-Security'
  AlertTopicArn:
    Description: Subscribe an email here to receive security alarms
    Value: !Ref SecurityAlertTopic